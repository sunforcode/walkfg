<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A hiking app for planning and tracking your hiking trips.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Walk - 徒步旅行助手">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Walk - 徒步旅行助手</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111f;
    }

    .home-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f6f7f5;
      background:
        linear-gradient(180deg, rgba(5, 13, 24, 0.2), rgba(7, 17, 31, 0.95)),
        radial-gradient(circle at 75% 20%, rgba(42, 78, 101, 0.22), transparent 48%),
        #07111f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .home-shell::before,
    .home-shell::after {
      content: "";
      position: absolute;
      right: -8%;
      bottom: 0;
      left: -8%;
      height: 27%;
      background: rgba(55, 74, 94, 0.26);
      clip-path: polygon(0 78%, 17% 48%, 29% 62%, 47% 16%, 68% 58%, 84% 36%, 100% 70%, 100% 100%, 0 100%);
    }

    .home-shell::after {
      height: 20%;
      background: rgba(38, 55, 76, 0.42);
      clip-path: polygon(0 100%, 19% 44%, 35% 68%, 58% 18%, 74% 58%, 100% 38%, 100% 100%);
    }

    .home-shell__menu {
      position: absolute;
      top: max(28px, env(safe-area-inset-top));
      right: 28px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 22px;
      line-height: 1;
    }

    .home-shell__content {
      transform: translateY(-8px);
    }

    .home-shell__title {
      margin: 0;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .home-shell__subtitle {
      margin: 6px 0 28px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 16px;
      letter-spacing: 1px;
    }

    .home-shell__question {
      margin: 0 0 26px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 20px;
    }

    .home-shell__button {
      display: inline-block;
      min-width: 104px;
      padding: 11px 24px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 18px;
    }

    .home-shell__hint {
      margin: 16px 0 0;
      color: rgba(255, 255, 255, 0.45);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading" class="home-shell" aria-label="Walk 首页">
    <div class="home-shell__menu">≡</div>
    <main class="home-shell__content">
      <h1 class="home-shell__title">WALK</h1>
      <p class="home-shell__subtitle">徒步旅行助手</p>
      <p class="home-shell__question">这周去哪徒步？</p>
      <span class="home-shell__button">找路线</span>
      <p class="home-shell__hint">还没有行程</p>
    </main>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.querySelector('#loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
