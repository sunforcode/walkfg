<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A hiking app for planning and tracking your hiking trips.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Walk - 徒步旅行助手">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Walk - 徒步旅行助手</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0a0a1a;
    }

    .home-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f6f7f5;
      z-index: 2147483647;
      background: linear-gradient(170deg, #0a0a1a 0%, #0d1b2a 55%, #1b2838 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      opacity: 1;
      transition: opacity 120ms ease-out;
      text-align: center;
    }

    .home-shell::before,
    .home-shell::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: min(280px, 33.18%);
      background: rgba(255, 255, 255, 0.04);
      clip-path: polygon(0 100%, 16% 42.9%, 26.7% 57.1%, 48% 14.3%, 69.3% 50%, 85.3% 28.6%, 100% 57.1%, 100% 100%);
    }

    .home-shell::after {
      height: min(280px, 33.18%);
      background: rgba(255, 255, 255, 0.02);
      clip-path: polygon(0 100%, 21.3% 57.1%, 37.3% 67.9%, 58.7% 25%, 80% 53.6%, 100% 42.9%, 100% 100%);
    }

    .home-shell__menu {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      line-height: 1;
    }

    .home-shell--leaving {
      pointer-events: none;
      opacity: 0;
    }

    .home-shell__content {
      padding: 0 28px;
    }

    .home-shell__title {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }

    .home-shell__subtitle {
      margin: 8px 0 32px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
    }

    .home-shell__question {
      margin: 0 0 48px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 20px;
      font-weight: 300;
      line-height: 1.4;
    }

    .home-shell__button {
      display: inline-block;
      padding: 14px 48px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 18px;
    }

    .home-shell__hint {
      margin: 16px 0 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading" class="home-shell" aria-label="Walk 首页">
    <div class="home-shell__menu">≡</div>
    <main class="home-shell__content">
      <h1 class="home-shell__title">WALK</h1>
      <p class="home-shell__subtitle">徒步旅行助手</p>
      <p class="home-shell__question">这周去哪徒步？</p>
      <span class="home-shell__button">找路线</span>
      <p class="home-shell__hint">还没有行程</p>
    </main>
  </div>

  <script>
    window.hideWalkHomeShell = function () {
      const shell = document.querySelector('#loading');
      if (!shell || shell.classList.contains('home-shell--leaving')) return;
      shell.classList.add('home-shell--leaving');
      shell.addEventListener('transitionend', function () {
        shell.remove();
      }, { once: true });
      window.setTimeout(function () {
        shell.remove();
      }, 200);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
