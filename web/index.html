<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A hiking app for planning and tracking your hiking trips.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Walk - 徒步旅行助手">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Walk - 徒步旅行助手</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- MapLibre GL JS for 3D maps -->
  <script src='https://unpkg.com/maplibre-gl@^4.3/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@^4.3/dist/maplibre-gl.css' rel='stylesheet'/>
  
  <style>
    /* 修复MapLibre GL在Web上的高度问题 */
    .maplibre-map {
      height: 100% !important;
      width: 100% !important;
    }
    
    /* 加载指示器样式 */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      background-color: #f5f5f5;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e3e3e3;
      border-top: 4px solid #2196F3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- 应用加载指示器 -->
  <div id="loading" class="loading-container">
    <div>
      <div class="loading-spinner"></div>
      <p style="margin-top: 16px; color: #666; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        正在加载徒步应用...
      </p>
    </div>
  </div>
  
  <script>
    // 隐藏加载指示器
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.querySelector('#loading');
      if (loading) {
        loading.remove();
      }
    });
    
    // 确保MapLibre GL正确加载
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof maplibregl !== 'undefined') {
        console.log('MapLibre GL 已成功加载，版本:', maplibregl.version);
      } else {
        console.error('MapLibre GL 加载失败');
      }
    });
  </script>
  
  <script>
    // 强制使用 HTML 渲染模式，避免从 Google CDN 加载 CanvasKit
    window.flutterLoader = {
      renderer: 'html'
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
