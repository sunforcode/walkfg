# Walk Flutter App CI/CD
#
# 公开仓库：runner 额度无限（Linux 与 macOS 均不计量费）。
#
# analyze-test : PR + push 都跑，静态检查 + 单元测试
# build-android: push 到 master 跑，产出 debug APK artifact
# build-ios    : push 到 master 或手动触发时，签名构建 IPA 并上传 TestFlight
# build-web    : push 到 master 跑，--base-href /app/ 构建，产出静态文件 artifact
# deploy-web   : push 到 master 跑，把 web 构建产物发布到 walk-server，
#                覆盖 ~/walk/flutter-web（nginx /app/ 路由的数据卷挂载点）
#
# Flutter 版本钉死与本地一致，防 CI 与本地行为漂移。

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: walkfg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.8'
  # pubspec.lock 里 214 个包记录的源是 pub.flutter-io.cn（本地开发镜像）。
  # CI runner 默认用 pub.dev，源不一致会让 pub 判定 lock 失效并全部重新解析，
  # dio 等包被升到最新版，出现本地不存在的 transformTimeout 等编译错误。
  # 指定同一镜像使 CI 与本地严格同源。
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        # *.g.dart 被 gitignore，CI 全新 checkout 无生成文件，
        # 不先跑 build_runner 则 analyze/build 必报 missing part 错误。
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare .env (placeholder)
        # pubspec.yaml 把 .env 声明为 asset，CI checkout 后无此文件会导致
        # asset bundle 构建失败。本 job 不需要真 token，占位即可。
        run: cp .env.example .env

      - name: Analyze
        # 全部 196 条均为 info 级（弃用提示等），无 error/warning。
        # --no-fatal-infos：info 不挡构建，error/warning 仍然挡，与本地日常行为一致。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        # test/ 目前仅有冒烟测试，后续补齐单元测试后自动纳入。
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        # *.g.dart 被 gitignore，CI 全新 checkout 无生成文件，
        # 不先跑 build_runner 则 analyze/build 必报 missing part 错误。
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare .env (inject Mapbox token)
        # pubspec.yaml 把 .env 声明为 asset，缺失则 asset bundle 构建失败。
        # Android 包内嵌地图需要真 token：从 secret 注入（公开仓库 secret
        # 只在 Actions 运行时可访问）。secret 未配置时回退占位值，构建不中断。
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          sed "s|pk.YOUR_MAPBOX_PUBLIC_TOKEN|${MAPBOX_TOKEN:-pk.YOUR_MAPBOX_PUBLIC_TOKEN}|" .env.example > .env

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  build-ios:
    name: Build iOS & Upload TestFlight
    runs-on: macos-15
    needs: analyze-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        # *.g.dart 被 gitignore，CI 全新 checkout 无生成文件，
        # 不先跑 build_runner 则 analyze/build 必报 missing part 错误。
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare .env (inject Mapbox token)
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          sed "s|pk.YOUR_MAPBOX_PUBLIC_TOKEN|${MAPBOX_TOKEN:-pk.YOUR_MAPBOX_PUBLIC_TOKEN}|" .env.example > .env

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/walk-signing.keychain-db"
          PROVISIONING_PROFILE_PATH="$RUNNER_TEMP/walk-app-store.mobileprovision"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/walk-distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROVISIONING_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/walk-distribution.p12" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PROFILE_UUID=$(security cms -D -i "$PROVISIONING_PROFILE_PATH" | plutil -extract UUID raw -)
          LEGACY_PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          XCODE_PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$LEGACY_PROFILES_DIR" "$XCODE_PROFILES_DIR"
          cp "$PROVISIONING_PROFILE_PATH" "$LEGACY_PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          cp "$PROVISIONING_PROFILE_PATH" "$XCODE_PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          security cms -D -i "$XCODE_PROFILES_DIR/$PROFILE_UUID.mobileprovision" | plutil -extract Name raw -
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed IPA
        run: >-
          flutter build ipa --release
          --build-number=${{ github.run_number }}
          --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          PRIVATE_KEY_PATH="$PRIVATE_KEYS_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          mkdir -p "$PRIVATE_KEYS_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["APP_STORE_CONNECT_API_PRIVATE_KEY"].strip()
          try:
              decoded = json.loads(raw)
              if isinstance(decoded, dict):
                  raw = decoded.get("private_key") or decoded.get("key") or ""
              elif isinstance(decoded, str):
                  raw = decoded
          except json.JSONDecodeError:
              pass

          private_key = raw.replace("\\n", "\n").strip() + "\n"
          if not private_key.startswith("-----BEGIN PRIVATE KEY-----"):
              raise SystemExit("APP_STORE_CONNECT_API_PRIVATE_KEY is not a PEM private key")

          path = Path.home() / ".appstoreconnect" / "private_keys" / f"AuthKey_{os.environ['APP_STORE_CONNECT_API_KEY_ID']}.p8"
          path.write_text(private_key)
          path.chmod(0o600)
          PY
          openssl pkey -in "$PRIVATE_KEY_PATH" -noout -check
          xcrun altool --upload-app \
            --type ios \
            --file "$(find build/ios/ipa -name '*.ipa' -print -quit)" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/walk-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/walk-distribution.p12" "$RUNNER_TEMP/walk-app-store.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        # *.g.dart 被 gitignore，CI 全新 checkout 无生成文件，
        # 不先跑 build_runner 则 analyze/build 必报 missing part 错误。
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare .env (placeholder)
        # pubspec.yaml 把 .env 声明为 asset，CI checkout 后无此文件会导致
        # asset bundle 构建失败。本 job 不需要真 token，占位即可。
        run: cp .env.example .env

      - name: Build Web (base-href /app/)
        # vialu.cn 的 Flutter Web 挂在 /app/ 子路径下，与 Admin 前端共用 nginx。
        # Web 必须使用线上 HTTPS 同源地址；若不传 dart-define，AppConfig 会回落到
        # 开发机的 http://192.168.31.127:8080，HTTPS 页面会因混合内容/不可达而加载失败。
        run: >-
          flutter build web --release --base-href /app/
          --dart-define=ENV=production
          --dart-define=PROD_BASE_URL=https://vialu.cn

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          # flutter_dotenv 将 .env 作为运行时 asset 加载。
          # upload-artifact@v4 默认排除隐藏文件，遗漏后线上会把
          # /app/assets/.env 回退成 index.html，导致 runApp 前初始化失败并白屏。
          include-hidden-files: true
          retention-days: 30

  deploy-web:
    name: Deploy Web to walk-server
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
        run: |
          mkdir -p ~/.ssh
          HOST=$(printf '%s' "$WALK_SERVER" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          ssh-keyscan -H "${HOST##*@}" >> ~/.ssh/known_hosts

      - name: Publish to walk-server
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          HOST=$(printf '%s' "$WALK_SERVER" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          # 覆盖 flutter-web 数据卷挂载点，nginx /app/ 路由立即生效，无需重建容器
          rsync -az --delete \
            web-build/ \
            "$HOST:$WALK_REMOTE_DIR/flutter-web/"
          echo "Published to $HOST:$WALK_REMOTE_DIR/flutter-web/"
