name: walk
description: "A hiking app for planning and tracking your hiking trips."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.1.5

  # 路由管理
  go_router: ^13.0.1

  # 网络请求
  dio: ^5.4.0
  http: ^1.1.0

  # 本地存储
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI组件
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_map: ^6.2.1
  flutter_map_cancellable_tile_provider: ^1.0.0
  latlong2: ^0.9.1
  fl_chart: ^1.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.1
  image_picker: ^1.0.4
  flutter_markdown: ^0.6.18
  photo_view: ^0.14.0
  share_plus: ^7.2.1
  flutter_local_notifications: ^16.1.0

  # 工具
  uuid: ^4.2.1
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  connectivity_plus: ^5.0.1
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.1
  flutter_dotenv: ^5.1.0
  logger: ^2.0.2+1
  json_annotation: ^4.9.0
  vector_math: ^2.1.4
  get_it: ^8.0.0

  # 地图和轨迹相关
  gpx: ^2.3.0
  xml: ^6.5.0
  archive: ^3.6.1
  flutter_map_location_marker: ^8.0.5
  flutter_map_line_editor: ^6.0.0
  flutter_map_marker_cluster: ^1.3.6
  polyline_codec: ^0.1.6
  tuple: ^2.0.2
  crypto: ^3.0.6
  flutter_map_tappable_polyline: ^6.0.0
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.2
  riverpod_generator: ^2.3.2
  flutter_native_splash: ^2.3.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/maps/
    - assets/mock_data/

flutter_native_splash:
  color: "#4CAF50"
  image: assets/images/splash.png
  android: true
  ios: true
