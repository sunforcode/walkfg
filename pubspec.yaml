name: walk
description: 一款功能强大的徒步旅行助手应用，帮助户外爱好者规划、准备和享受徒步旅行。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.1.5

  # 路由管理
  go_router: ^13.0.1

  # 网络请求
  dio: ^5.3.3
  http: ^1.1.0

  # 本地存储
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI组件
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_map: ^6.0.1
  latlong2: ^0.9.0
  fl_chart: ^0.65.0
  intl: ^0.19.0
  url_launcher: ^6.2.1
  image_picker: ^1.0.4
  flutter_markdown: ^0.6.18
  photo_view: ^0.14.0
  share_plus: ^7.2.1
  flutter_local_notifications: ^16.1.0

  # 工具
  uuid: ^4.2.1
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  connectivity_plus: ^5.0.1
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.0
  flutter_dotenv: ^5.1.0
  logger: ^2.0.2+1
  json_annotation: ^4.8.1
  vector_math: ^2.1.4
  get_it: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.2
  flutter_native_splash: ^2.3.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/maps/
    - assets/data/
    - .env

flutter_native_splash:
  color: "#4CAF50"
  image: assets/images/splash.png
  android: true
  ios: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
